# restic-docker-backup Web 版 compose 模板（方案 §4 / §4.1）
#
# 运行形态（A0 模式收敛，2026-10-17）：只认容器内可见的目录树——宿主机目录挂载到
# /sources（默认 ./sources，可用 SOURCES_DIR 覆盖），备份源在 UI 里勾选，增删零重启。
# 远端数据（NFS/SMB/S3/B2/OneDrive…）先在宿主机挂载（rclone mount 通吃 70+ 云），
# 再把挂载点映射进 /sources 即可当备份源——详见 docs/部署指南.md「远端源挂载」。
#
# compose 中剩余项全部是"容器怎么跑"的部署事实（挂载/端口/用户/镜像），
# 业务配置（仓库、凭据、策略、调度、通知、dump、时区）一律在 Web 界面完成（§4.1）。
#
# 注意（compose 插值规则）：卷挂载串里的 ${SOURCES_DIR} 由"构建/运行 compose 的环境"
# 插值，不是容器 environment。切换挂载读写档时改下面 volumes 行尾的 rw/ro 即可。

name: restic-docker-backup-web

services:
  restic-web:
    # 本文件是**部署模板**：只用已发布的镜像，不含 build 段（避免本地产物顶替同名发布镜像）。
    # 发布标签形如 <应用版本>-restic<restic版本>；与 CI（scripts/ci-docker.sh）产出一致。
    # 需要本地自行构建时叠加 docker-compose.build.yml（见该文件头部用法），不要在这里加 build 段。
    image: dolphin738/restic-web:1.0.0-restic0.19.1
    container_name: restic-web
    # 默认 root 档：保证原位恢复完整还原属主/权限；安全敏感场景改 "1000:1000"
    # 改非 root 档前须在宿主机执行：chown -R 1000:1000 ./data ./cache
    user: "0:0"
    environment:
      TZ: Asia/Shanghai
      PORT: "8000"
      # SSE 空闲心跳间隔（秒）。反代 idle timeout 明显小于该值时需下调，
      # 否则反代会先于心跳断开长连接，前端误判为断流并重连。
      SSE_HEARTBEAT_SECONDS: "15"
      # 日志级别：DEBUG / INFO（默认）/ WARNING / ERROR。
      # 容器日志行首固定带时间戳（取本 TZ，形如 2026-10-12 04:30:27+0800），
      # 访问日志（uvicorn.access）每请求一行，含 30s 一次的健康探测。
      # 已迁入「系统设置-系统-日志级别」：删除本行即可在界面调（保存即时生效）；
      # 保留本行 = 以 compose 为准（界面该字段置灰，见 E07 env 覆盖机制）。
      #LOG_LEVEL: "INFO"
      # rclone 万能后端（A1）：restic 对 rclone: 仓库按需拉起 rclone 子进程，
      # 该变量经容器环境 → restic → rclone 子进程原样传递，指向下方挂载的 conf。
      # 显式指定而非依赖 rclone 默认路径：默认路径随运行用户变化
      # （root 档 /root/.config、nonRoot 档 /home/backup/.config），换档即失效。
      RCLONE_CONFIG: /etc/rclone/rclone.conf
      # SQLite 锁等待超时（毫秒）。高并发落库或外部工具长时间读库时若频繁
      # SQLITE_BUSY 可上调；过大则失败延迟变长。
      # 已迁入「系统设置-系统-SQLite 锁等待」：删除本行即可在界面调
      # （对新建连接生效）；保留本行 = 以 compose 为准（界面置灰）。
      #DB_BUSY_TIMEOUT_MS: "5000"
      # 非 root 档部署时由 entrypoint 用于自动 chown（root 档下默认 0:0，无需设置）
      # PUID: "1000"
      # PGID: "1000"
      # 后端凭据默认在 Web 界面配置；如需 GitOps/secret 注入式部署可在此覆盖（优先于 UI 值）：
      # AWS_ACCESS_KEY_ID: ""
      # AWS_SECRET_ACCESS_KEY: ""
      # AWS_DEFAULT_REGION: ""
    volumes:
      # ---- 备份源根（A0 后唯一形态）：宿主机目录 → 容器 /sources ----
      # 默认 ./sources（compose 文件同级目录）；SOURCES_DIR 可指向任意宿主机目录
      # （含 NFS/SMB/rclone mount 的挂载点）。rw 支持原位恢复；ro 为安全档
      # （仅备份浏览与"恢复到其他位置"）。远端源挂载示例见 docs/部署指南.md。
      - ${SOURCES_DIR:-./sources}:/sources:rw

      # 恢复目标（时间戳子目录落点；sources 卷 rw 档下原位恢复写回 /sources 内路径）
      - /restore:/restore

      # 仅"本地路径仓库"需要；s3/b2 等对象存储后端可整行保持注释
      # 启用时：宿主机目录 → 容器 /repo；UI 仓库地址填 /repo（或 /repo/子目录）；首次使用先跑一次 init
      # 注意：restic 跑在容器内，只认容器路径——UI 里填宿主机真实路径会报"仓库不存在或未初始化"
      # - /mnt/backup/restic-repo:/repo

      # rclone 万能后端配置（A1）：宿主机 `rclone config` 生成后挂入（UI 只读探测
      # remote 清单，不生成、不编辑、不展示 conf 内凭据——OAuth token 永不进 API）。
      # **必须 :rw**：网盘 OAuth token 过期时 rclone 回写 conf，只读挂载 = 授权静默失效
      # （R-022 登记的运维约束，A1 升级为硬约束）。sftp/azure/gcs/rest 等原生后端无需此行。
      # **宿主机文件须先存在**：Docker 对不存在的 bind 源会建目录顶替，rclone 将读不到
      # conf（状态卡显示"未检测到配置文件"）。首次部署：touch ./rclone/rclone.conf。
      - ./rclone/rclone.conf:/etc/rclone/rclone.conf:rw

      # sftp 后端（A1）：restic 经系统 ssh 子进程免密登录——挂载私钥与 known_hosts。
      # root 档（上方 user: "0:0"）挂 /root/.ssh；nonRoot 档（1000:1000）改挂
      # /home/backup/.ssh。私钥须 0600 且属主匹配运行用户（ssh 拒绝权限过松的密钥）；
      # known_hosts 预先在宿主机生成（ssh-keyscan host >> known_hosts），否则首次
      # 连接的 host key 确认会以非交互方式失败。详见 docs/部署指南.md「远端仓库后端」。
      # - ./ssh/id_ed25519:/root/.ssh/id_ed25519:ro
      # - ./ssh/known_hosts:/root/.ssh/known_hosts:ro

      # SQLite + 任务日志 + dump + **仓库密码文件**（属主要求见方案 §4：非 root 档须 chown 1000:1000）
      # 密码文件按 E5 per-repo 布局放在数据卷内：./data/repos/default/password
      # （对应容器路径 /data/repos/default/password，由 PASSFILE_ROOT 决定根目录）
      - ./data:/data
      # restic 缓存，务必持久化（否则每次全量重扫）
      - ./cache:/cache/restic
    ports:
      - "8000:8000"
    restart: unless-stopped
