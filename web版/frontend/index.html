<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- favicon：SVG 矢量（任意尺寸无损），显式声明避免对 /favicon.ico 的隐式请求 404 -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>restic 备份控制台</title>
    <style>
      /* 深色为默认主题：先铺底，避免首屏白闪。
         底色与暗色令牌 bodyColor（theme/tokens.ts #14161C）保持一致（PV-3 既有缺陷收敛）。 */
      html,
      body,
      #app {
        margin: 0;
        height: 100%;
        background: #14161C;
        color: #eef1f8;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
