# ============================================================
# CNB 云原生构建流水线 —— 仅手动触发（web_trigger），无任何自动构建
#
# 单条手动流水线：后端验证 → 前端验证 → docker build → 推 CNB 制品库 → 推 Docker Hub
# （Docker Hub 未配置凭据时该段自动跳过，不影响日常构建）
#
# 标签策略（对齐《Web版改造方案.md》L249/L526 与《架构设计文档.md》§10.2）：
#   固定标签   = sha 短标签（COMMIT_SHORT）+ latest
#   条件追加   = 当前 commit 已打 git tag 时，追加双版本标签
#                <app版本>-restic<restic版本>（如 1.0.0-restic0.19.1，v 前缀自动剥离）
#
# Docker Hub 凭据：经 imports 注入私有仓库 dolphin738/my 的 main 分支 docker.yml，
#   需定义三个键：DOCKERHUB_USER / DOCKERHUB_TOKEN / DOCKERHUB_NAMESPACE
#
# 镜像产物：
#   CNB 制品库  docker.cnb.cool/dolphin738/restic-docker-backup（内置凭据，免 secrets）
#   Docker Hub <DOCKERHUB_NAMESPACE>/restic-web
#
# 依赖安装源固化：腾讯云 PyPI 镜像（P1 实测 pypi 直连/清华/阿里均不可用）
# ============================================================

"$":
  web_trigger:
    - name: backend-verify
      docker:
        # 官方 uv 镜像（含 uv + python3.13）；依赖按 uv.lock 锁定安装，构建可重复
        image: ghcr.io/astral-sh/uv:python3.13-bookworm
      env:
        UV_DEFAULT_INDEX: https://mirrors.cloud.tencent.com/pypi/simple
        UV_INDEX_URL: https://mirrors.cloud.tencent.com/pypi/simple
      stages:
        - name: sync (frozen)
          script: cd web版/backend && uv sync --frozen --extra dev
        - name: ruff
          script: cd web版/backend && uv run --no-sync ruff check app tests
        - name: pytest
          script: cd web版/backend && uv run --no-sync pytest -q

    - name: frontend-verify
      docker:
        image: node:22
      stages:
        - name: install
          script:
            - corepack enable
            - cd web版/frontend && pnpm install --frozen-lockfile
        - name: typecheck
          script: cd web版/frontend && pnpm run typecheck
        - name: vitest
          script: cd web版/frontend && pnpm run test
        - name: build
          script: cd web版/frontend && pnpm run build

    - name: docker-build-push
      imports: https://cnb.cool/dolphin738/my/-/blob/main/docker.yml
      services:
        - docker
      env:
        RESTIC_VERSION: "0.19.1"
      stages:
        # 构建与推送逻辑收敛为仓库脚本（scripts/ci-docker.sh）：
        # 可本地审阅/测试，规避 YAML 内联多行 shell 的拼接与展开坑（CI 实测踩坑）
        - name: build and push
          script: bash scripts/ci-docker.sh all
