# Docker Hub 推送凭据（被 .cnb.yml 的 imports 注入流水线）
# 使用方法：把下面三个值填好并提交到 main 分支（或直接在 CNB 网页端编辑 main 分支的此文件）。
# 安全建议：DOCKERHUB_TOKEN 使用 Docker Hub → Account Settings → Security 生成的
#           Access Token（只读仓库权限按需选择），不要使用账号密码。
# 注意：填入真实 token 会随 git 历史保存；如介意，可将本文件放到另一个私有仓库并通过
#       imports 指向该地址（修改 .cnb.yml 中的 imports 行）。
#
# 未配置（保持空值）时，流水线的 Docker Hub 推送段会自动跳过，不影响 CNB 制品库推送。

DOCKERHUB_USER: ""
DOCKERHUB_TOKEN: ""
DOCKERHUB_NAMESPACE: ""
