# CNB 手动触发按钮（按钮显示在分支详情页：代码 → 分支 → 点进分支 → 右上角按钮）
# 事件须与 .cnb.yml 中 "$: web_trigger:" 配置的流水线对应，否则点击无效果。
branch:
  - reg: ^(main|dev)$
    buttons:
      - name: 构建并推送镜像
        description: 后端验证(ruff+pytest) → 前端验证(typecheck+vitest+build) → docker build → 推 CNB 制品库 + Docker Hub（Hub 未配置凭据时自动跳过）
        event: web_trigger
        isDefault: true
